<!-- ============================================================
  admin_sidebar.html — Reusable Admin Sidebar
  ============================================================
  Usage:
    {% include 'partials/admin_sidebar.html' with active='dashboard' %}

  active values:
    dashboard | staff | centers | attendance | reports | alerts | notifications
  ============================================================ -->

<aside id="sidebar" class="sidebar" role="navigation" aria-label="Admin navigation">

  <!-- ===== Brand / Logo ===== -->
  <a href="{% url 'admin_dashboard' %}" class="sidebar-brand" aria-label="SRSP Dashboard home">
    <span class="brand-icon" aria-hidden="true">
      <i class="fas fa-map-pin"></i>
    </span>
    <span class="brand-text">SRSP System</span>
  </a>

  <!-- ===== User Info (compact) ===== -->
  <div class="sidebar-user px-3 py-2 d-flex align-items-center gap-2 border-bottom"
       style="border-color:rgba(255,255,255,0.06) !important">
    <div class="flex-shrink-0 d-flex align-items-center justify-content-center rounded-circle"
         style="width:30px;height:30px;background:var(--srsp-accent);color:var(--srsp-primary-dark);font-size:0.75rem;font-weight:600">
      <i class="fas fa-user-cog fa-xs"></i>
    </div>
    <div class="flex-grow-1 min-width-0">
      <p class="mb-0 text-truncate" style="font-size:0.8125rem;font-weight:500;color:#fff">
        {% firstof request.user.get_full_name "Admin" %}
      </p>
      <p class="mb-0 text-truncate" style="font-size:0.6875rem;color:#8AAB9A">Administrator</p>
    </div>
  </div>

  <!-- ===== Navigation Menu ===== -->
  <nav class="sidebar-nav" aria-label="Main navigation">

    <ul class="list-unstyled mb-0">

      <!-- Dashboard -->
      <li>
        <a href="{% url 'admin_dashboard' %}"
           class="sidebar-link {% if active == 'dashboard' %}active{% endif %}"
           aria-current="{% if active == 'dashboard' %}page{% endif %}">
          <i class="fas fa-th-large" aria-hidden="true"></i>
          <span>Dashboard</span>
        </a>
      </li>

      <!-- Staff Management -->
      <li>
        <a href="{% url 'admin_staff' %}"
           class="sidebar-link {% if active == 'staff' %}active{% endif %}"
           aria-current="{% if active == 'staff' %}page{% endif %}">
          <i class="fas fa-users" aria-hidden="true"></i>
          <span>Staff management</span>
        </a>
      </li>

      <!-- Center Management -->
      <li>
        <a href="{% url 'admin_centers' %}"
           class="sidebar-link {% if active == 'centers' %}active{% endif %}"
           aria-current="{% if active == 'centers' %}page{% endif %}">
          <i class="fas fa-building" aria-hidden="true"></i>
          <span>Center management</span>
        </a>
      </li>

      <!-- Attendance Management -->
      <li>
        <a href="{% url 'admin_attendance' %}"
           class="sidebar-link {% if active == 'attendance' %}active{% endif %}"
           aria-current="{% if active == 'attendance' %}page{% endif %}">
          <i class="fas fa-calendar-check" aria-hidden="true"></i>
          <span>Attendance</span>
        </a>
      </li>

      <!-- Reports -->
      <li>
        <a href="{% url 'admin_reports' %}"
           class="sidebar-link {% if active == 'reports' %}active{% endif %}"
           aria-current="{% if active == 'reports' %}page{% endif %}">
          <i class="fas fa-file-alt" aria-hidden="true"></i>
          <span>Reports</span>
        </a>
      </li>

      <!-- Emergency Alerts -->
      <li>
        <a href="{% url 'admin_alerts' %}"
           class="sidebar-link danger {% if active == 'alerts' %}active{% endif %}"
           aria-current="{% if active == 'alerts' %}page{% endif %}">
          <i class="fas fa-exclamation-triangle" aria-hidden="true"></i>
          <span>Emergency alerts</span>
        </a>
      </li>

      <!-- Notifications -->
      <li>
        <a href="{% url 'admin_notifications' %}"
           class="sidebar-link {% if active == 'notifications' %}active{% endif %}"
           aria-current="{% if active == 'notifications' %}page{% endif %}">
          <i class="fas fa-bell" aria-hidden="true"></i>
          <span>Notifications</span>
        </a>
      </li>

      <!-- Profile -->
      <li>
        <a href="{% url 'admin_profile' %}"
           class="sidebar-link {% if active == 'profile' %}active{% endif %}"
           aria-current="{% if active == 'profile' %}page{% endif %}">
          <i class="fas fa-user-circle" aria-hidden="true"></i>
          <span>Profile</span>
        </a>
      </li>

      <!-- Settings -->
      <li>
        <a href="{% url 'admin_settings' %}"
           class="sidebar-link {% if active == 'settings' %}active{% endif %}"
           aria-current="{% if active == 'settings' %}page{% endif %}">
          <i class="fas fa-cog" aria-hidden="true"></i>
          <span>Settings</span>
        </a>
      </li>

    </ul>
  </nav>

  <!-- ===== Sidebar Footer ===== -->
  <div class="sidebar-footer">
    <a href="{% url 'login' %}" class="sidebar-link" aria-label="Log out of your account">
      <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
      <span>Log out</span>
    </a>
  </div>

</aside>
